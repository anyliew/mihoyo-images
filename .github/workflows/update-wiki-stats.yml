name: Update Wiki Role Stats

# normal-character 有更新时自动重建 wiki 统计页；也支持在 Actions 页面手动触发。
on:
  push:
    paths:
      - 'normal-character/**'
      - '.github/workflows/update-wiki-stats.yml'
  workflow_dispatch:
    inputs:
      low_threshold:
        description: '图片数低于多少视为待补齐（留空用默认 5）'
        required: false
        default: '5'
      override:
        description: '人工指定目录映射，格式 目录名=游戏:ID（原神/gi 或 星铁/hsr），多个用逗号分隔'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: wiki-role-stats
  cancel-in-progress: true

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN 没有 .wiki 仓库写权限，且 fine-grained PAT 的仓库列表
      # 通常不包含 <repo>.wiki，所以这里必须用 classic PAT（public_repo scope）。
      - name: Verify WIKI_TOKEN
        shell: bash
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$WIKI_TOKEN" ]; then
            echo "::error::缺少 WIKI_TOKEN，无法推送 wiki 仓库。"
            echo "请到 Settings → Secrets and variables → Actions → New repository secret"
            echo "新建名为 WIKI_TOKEN 的 secret，值填 classic PAT（勾选 public_repo）。"
            exit 1
          fi

      - name: Checkout resources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ secrets.WIKI_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate stats pages
        shell: bash
        env:
          LOW_THRESHOLD: ${{ inputs.low_threshold }}
          OVERRIDE: ${{ inputs.override }}
        run: |
          args=(--source . --wiki wiki --repo "${{ github.repository }}" --branch main)
          if [ -n "$LOW_THRESHOLD" ]; then args+=(--low-threshold "$LOW_THRESHOLD"); fi
          if [ -n "$OVERRIDE" ]; then
            IFS=',' read -ra pairs <<< "$OVERRIDE"
            for p in "${pairs[@]}"; do
              [ -n "$p" ] && args+=(--override "$p")
            done
          fi
          python wiki/scripts/update_stats.py "${args[@]}"

      - name: Commit and push wiki
        working-directory: wiki
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "统计页无变化，跳过提交"
            exit 0
          fi
          git add -A
          git commit -m "chore: 更新米哈游角色图片资源统计（${GITHUB_SHA::7}）"
          git push
